# docker-compose (same-origin) setup only: serves the SPA and proxies /api and /hubs to the `api` service, so the
# CSP can stay connect-src 'self'.
server {
  listen 8080;
  root /usr/share/nginx/html;

  server_tokens off;

  # Dot-paths (/.env, /.git/config, ...) are never part of the app: answer 404 instead of the SPA fallback.
  location ~ /\. {
    include /etc/nginx/snippets/security-headers.conf;
    return 404;
  }

  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API reference (Scalar UI + OpenAPI document), so the API itself needs no published port.
  location ~ ^/(docs|openapi)(/|$) {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }

  location /hubs/ {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
