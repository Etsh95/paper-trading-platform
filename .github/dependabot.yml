# Weekly update PRs. Workflow actions are pinned to commit SHAs, so Dependabot is what moves them forward.
#
# The backend stays on .NET 10 (LTS). Moving to a new .NET major is one deliberate change (SDK, target framework,
# runtime image and every Microsoft.* package together), so Dependabot only proposes patches for those, and the
# SignalR client follows the server's major version.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Its maintained `v1` is a branch; the `v1` tag is a stale 2021 commit that Dependabot would "update" to.
      # Bump the pinned SHA by hand from the v1 branch instead.
      - dependency-name: Azure/static-web-apps-deploy

  - package-ecosystem: nuget
    directory: /backend
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ["*"]
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        patterns: ["*"]
    ignore:
      - dependency-name: "@microsoft/signalr"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      e2e:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly
